<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI 情绪日记 - 心情急救包</title>
  <meta name="theme-color" content="#e85a7a">
  <link rel="manifest" href="/static/manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="bg-glow"></div>
  <div class="container">
    <header>
      <h1>AI 情绪日记</h1>
      <p class="subtitle">在情绪很重的时候，先把自己稳稳接住</p>
      <div class="top-bar">
        <nav>
          <a href="/">分析</a>
          <a href="/history">历史记录</a>
          <a href="/trends">趋势分析</a>
          <a class="active" href="/kit">急救包</a>
        </nav>
      </div>
    </header>
    <main>
      <section class="section card kit-hero">
        <p class="section-kicker">Emergency Kit</p>
        <h2>心情急救包</h2>
        <p>如果你现在很难受，先不用解决整个人生。只完成下面一个很小的步骤。</p>
      </section>
      <section class="section card breathing-card">
        <div class="kit-title-row">
          <div>
            <p class="section-kicker">Breathing</p>
            <h2>呼吸练习</h2>
          </div>
          <button id="breath-toggle" class="secondary-button" type="button">开始</button>
        </div>
        <div class="breath-orb" id="breath-orb">吸气</div>
        <p id="breath-label" class="kit-muted">跟随圆形节奏，慢慢吸气、停留、呼气。</p>
      </section>
      <section class="section card grounding-card">
        <p class="section-kicker">Grounding</p>
        <h2>5-4-3-2-1 接地练习</h2>
        <div class="grounding-list">
          <label><input type="checkbox"> 说出你看见的 5 个东西</label>
          <label><input type="checkbox"> 触摸你能感到的 4 个东西</label>
          <label><input type="checkbox"> 听见周围的 3 种声音</label>
          <label><input type="checkbox"> 闻到 2 种气味</label>
          <label><input type="checkbox"> 感受 1 个身体正在支撑你的地方</label>
        </div>
      </section>
      <section class="section card support-card">
        <p class="section-kicker">Support</p>
        <h2>给可信任的人发一句话</h2>
        <textarea id="support-message" rows="4">我现在状态不太好，可能不需要你马上解决什么，但我想让你陪我说几句话。</textarea>
        <button id="copy-support" class="secondary-button" type="button">复制这句话</button>
        <p id="copy-status" class="kit-muted"></p>
      </section>
      <section class="section card safety-card">
        <p class="section-kicker">Safety</p>
        <h2>安全提醒</h2>
        <p>如果你有伤害自己或他人的冲动，请立刻联系身边可信任的人、当地紧急服务，或前往最近的医院急诊。你不需要一个人撑过去。</p>
      </section>
    </main>
    <footer class="footer-note">AI 结果仅供参考，不替代专业心理咨询或医疗建议。</footer>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
