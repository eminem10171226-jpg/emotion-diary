<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI 情绪日记</title>
  <meta name="theme-color" content="#e85a7a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="情绪日记">
  <link rel="manifest" href="/static/manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="bg-glow"></div>
  <div id="profile-modal" class="profile-modal hidden" role="dialog" aria-modal="true" aria-labelledby="profile-title">
    <form id="profile-form" class="profile-panel">
      <div class="profile-modal-head">
        <div>
          <p class="section-kicker">Profile</p>
          <h2 id="profile-title" data-i18n="profileTitle">先认识你一点点</h2>
        </div>
        <button id="profile-skip" class="ghost-button compact-button" type="button" data-i18n="profileSkip">稍后</button>
      </div>
      <p class="profile-intro" data-i18n="profileIntro">选择你喜欢的事物，之后的分析建议会更贴近你的生活。</p>
      <div class="profile-form-grid">
        <fieldset class="profile-group">
          <legend data-i18n="profileSports">运动</legend>
          <label><input type="checkbox" name="sports" value="网球"><span>网球</span></label>
          <label><input type="checkbox" name="sports" value="足球"><span>足球</span></label>
          <label><input type="checkbox" name="sports" value="篮球"><span>篮球</span></label>
          <label><input type="checkbox" name="sports" value="羽毛球"><span>羽毛球</span></label>
          <label><input type="checkbox" name="sports" value="跑步"><span>跑步</span></label>
          <label><input type="checkbox" name="sports" value="健身"><span>健身</span></label>
        </fieldset>
        <fieldset class="profile-group">
          <legend data-i18n="profileGames">游戏 / 电竞</legend>
          <label><input type="checkbox" name="games" value="英雄联盟"><span>英雄联盟</span></label>
          <label><input type="checkbox" name="games" value="三角洲行动"><span>三角洲行动</span></label>
          <label><input type="checkbox" name="games" value="CSGO/CS2"><span>CSGO/CS2</span></label>
          <label><input type="checkbox" name="games" value="王者荣耀"><span>王者荣耀</span></label>
          <label><input type="checkbox" name="games" value="原神"><span>原神</span></label>
        </fieldset>
        <fieldset class="profile-group">
          <legend data-i18n="profileHobbies">日常爱好</legend>
          <label><input type="checkbox" name="hobbies" value="看电影"><span>看电影</span></label>
          <label><input type="checkbox" name="hobbies" value="听音乐"><span>听音乐</span></label>
          <label><input type="checkbox" name="hobbies" value="阅读"><span>阅读</span></label>
          <label><input type="checkbox" name="hobbies" value="摄影"><span>摄影</span></label>
          <label><input type="checkbox" name="hobbies" value="绘画"><span>绘画</span></label>
          <label><input type="checkbox" name="hobbies" value="旅行"><span>旅行</span></label>
        </fieldset>
        <fieldset class="profile-group">
          <legend data-i18n="profileMusic">音乐类型</legend>
          <label><input type="checkbox" name="music_genres" value="流行"><span>流行</span></label>
          <label><input type="checkbox" name="music_genres" value="民谣"><span>民谣</span></label>
          <label><input type="checkbox" name="music_genres" value="轻音乐"><span>轻音乐</span></label>
          <label><input type="checkbox" name="music_genres" value="R&B"><span>R&B</span></label>
          <label><input type="checkbox" name="music_genres" value="摇滚"><span>摇滚</span></label>
          <label><input type="checkbox" name="music_genres" value="电子"><span>电子</span></label>
          <label><input type="checkbox" name="music_genres" value="古典"><span>古典</span></label>
          <label><input type="checkbox" name="music_genres" value="Lo-fi"><span>Lo-fi</span></label>
        </fieldset>
      </div>
      <div class="profile-fields">
        <label>
          <span data-i18n="profileMbti">MBTI</span>
          <select id="profile-mbti" name="mbti">
            <option value="" data-i18n="profileMbtiEmpty">不确定 / 暂不选择</option>
            <option>INTJ</option><option>INTP</option><option>ENTJ</option><option>ENTP</option>
            <option>INFJ</option><option>INFP</option><option>ENFJ</option><option>ENFP</option>
            <option>ISTJ</option><option>ISFJ</option><option>ESTJ</option><option>ESFJ</option>
            <option>ISTP</option><option>ISFP</option><option>ESTP</option><option>ESFP</option>
          </select>
        </label>
        <label>
          <span data-i18n="profileMovie">喜欢的电影类型</span>
          <input id="profile-movie" name="movie_preference" type="text" placeholder="例如：科幻、悬疑、治愈片" data-i18n-placeholder="profileMoviePlaceholder">
        </label>
        <label>
          <span data-i18n="profileNotes">其他想让 AI 记住的偏好</span>
          <textarea id="profile-notes" name="notes" rows="2" placeholder="例如：不喜欢太鸡汤，希望建议更具体" data-i18n-placeholder="profileNotesPlaceholder"></textarea>
        </label>
      </div>
      <div class="profile-weather-row">
        <button id="profile-locate" class="secondary-button" type="button" data-i18n="profileLocate">获取城市天气</button>
        <p id="profile-location-status" class="profile-location-status" data-i18n="profileLocationIdle">可选：授权后会按当日天气给建议。</p>
      </div>
      <button class="profile-save-button" type="submit" data-i18n="profileSave">保存并开始</button>
    </form>
  </div>
  <div class="container">
    <header>
      <h1 data-i18n="appTitle">AI 情绪日记</h1>
      <p class="subtitle" data-i18n="homeSubtitle">记录当下，温柔看见自己的情绪变化</p>
    </header>

    <main>
      <section class="settings-strip" aria-label="偏好设置">
        <label class="setting-field">
          <span data-i18n="personaLabel">人格风格</span>
          <select id="persona">
            {% for name in personas %}
            <option value="{{ name }}">{{ name }}</option>
            {% endfor %}
          </select>
        </label>
        <label class="setting-field">
          <span data-i18n="uiLanguageLabel">界面语言</span>
          <select id="language">
            <option value="zh" selected data-i18n="languageChinese">中文</option>
            <option value="en" data-i18n="languageEnglish">English</option>
          </select>
        </label>
      </section>
      <button id="profile-edit" class="profile-edit-button" type="button" data-i18n="profileEdit">个性偏好</button>
      <section id="pet-card" class="pet-card" aria-live="polite"></section>
      <section class="diary-section card composer-card">
        <div class="composer-head">
          <div>
            <p class="section-kicker">Today</p>
            <h2 data-i18n="composeTitle">记录今日感受</h2>
          </div>
          <span id="draft-count" class="draft-count">0 字</span>
        </div>
        <div class="textarea-shell">
          <textarea id="diary" rows="6" placeholder="写下你今天的心情（支持 emoji）。" data-i18n-placeholder="diaryPlaceholder"></textarea>
        </div>
        <div class="action-row composer-actions">
          <span class="privacy-note" data-i18n="privacyNote">仅保存在你的当前会话</span>
          <button id="voice-diary" class="secondary-button" type="button" data-i18n="voiceInput">语音输入</button>
          <button id="analyze" data-i18n="startAnalysis">开始分析</button>
        </div>
        <div id="offline-drafts" class="offline-drafts hidden"></div>
        <div id="analysis-result" class="result-box hidden result-pretty"></div>
        <div id="analysis-error" class="error-box hidden"></div>
      </section>
      <section class="section card ritual-panel hidden" id="ritual-panel">
        <div class="mailbox-title-row">
          <div>
            <p class="section-kicker">Ritual</p>
            <h2 data-i18n="ritualTitle">情绪仪式</h2>
          </div>
        </div>
        <div id="ritual-actions" class="ritual-actions"></div>
      </section>
      <section class="section card future-panel">
        <div class="mailbox-title-row">
          <div>
            <p class="section-kicker">Future Me</p>
            <h2 data-i18n="futureTitle">未来的自己</h2>
          </div>
        </div>
        <div class="future-form">
          <textarea id="future-message" rows="3" placeholder="写一句话给未来的自己。" data-i18n-placeholder="futurePlaceholder"></textarea>
          <div class="future-controls">
            <select id="future-days">
              <option value="1" data-i18n="tomorrow">明天</option>
              <option value="3" data-i18n="after3Days">3 天后</option>
              <option value="7" selected data-i18n="after7Days">7 天后</option>
              <option value="14" data-i18n="after14Days">14 天后</option>
            </select>
            <button id="save-future" class="secondary-button" type="button" data-i18n="save">保存</button>
          </div>
        </div>
        <div id="future-list" class="future-list"></div>
      </section>
      <section class="section card privacy-panel">
        <div class="mailbox-title-row">
          <div>
            <p class="section-kicker">Private</p>
            <h2 data-i18n="privacyLockTitle">私密锁</h2>
          </div>
        </div>
        <div class="privacy-lock-form">
          <input id="pin-input" type="password" inputmode="numeric" maxlength="4" placeholder="设置 4 位 PIN" data-i18n-placeholder="pinPlaceholder">
          <button id="save-pin" class="secondary-button" type="button" data-i18n="setPin">设置</button>
          <button id="clear-pin" class="ghost-button" type="button" data-i18n="closePin">关闭</button>
        </div>
        <p id="privacy-status" class="privacy-lock-status"></p>
      </section>
      <section class="section card mailbox-panel">
        <div class="mailbox-title-row">
          <div>
            <p class="section-kicker">Letters</p>
            <h2 data-i18n="mailboxTitle">心情信箱</h2>
          </div>
          <button id="clear-mailbox" class="ghost-button" type="button" data-i18n="clear">清空</button>
        </div>
        <div id="mailbox-list" class="mailbox-list"></div>
      </section>
    </main>
    <footer class="footer-note" data-i18n="footerNote">AI 结果仅供参考，不替代专业心理咨询或医疗建议。</footer>
  </div>
  <nav class="bottom-nav" aria-label="页面导航">
    <a class="active" href="/" aria-current="page">
      <span class="nav-mark" aria-hidden="true">
        <svg class="nav-icon" viewBox="0 0 24 24">
          <path d="M4 10.6 12 4l8 6.6v8.2a1.8 1.8 0 0 1-1.8 1.8H5.8A1.8 1.8 0 0 1 4 18.8v-8.2Z"/>
          <path d="M8.2 11.5h7.6M8.2 15h5.3"/>
        </svg>
      </span>
      <span class="nav-label" data-i18n="navAnalyze">分析</span>
    </a>
    <a href="/history">
      <span class="nav-mark" aria-hidden="true">
        <svg class="nav-icon" viewBox="0 0 24 24">
          <path d="M4.5 12a7.5 7.5 0 1 0 2.1-5.2"/>
          <path d="M4.4 5v4h4M12 8v4.4l3 1.8"/>
        </svg>
      </span>
      <span class="nav-label" data-i18n="navHistory">历史记录</span>
    </a>
    <a href="/trends">
      <span class="nav-mark" aria-hidden="true">
        <svg class="nav-icon" viewBox="0 0 24 24">
          <path d="M4 18.5h16M5.2 15.6 9 11.8l3.2 2.9 5.9-7.1"/>
          <path d="M9 11.8h.01M12.2 14.7h.01M18.1 7.6h.01"/>
        </svg>
      </span>
      <span class="nav-label" data-i18n="navTrends">趋势分析</span>
    </a>
    <a href="/kit">
      <span class="nav-mark" aria-hidden="true">
        <svg class="nav-icon" viewBox="0 0 24 24">
          <path d="M8.4 7.2V5.9a1.8 1.8 0 0 1 1.8-1.8h3.6a1.8 1.8 0 0 1 1.8 1.8v1.3"/>
          <path d="M5.4 7.2h13.2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5.4a2 2 0 0 1-2-2v-9a2 2 0 0 1 2-2Z"/>
          <path d="M12 10.5v6.2M8.9 13.6h6.2"/>
        </svg>
      </span>
      <span class="nav-label" data-i18n="navKit">急救包</span>
    </a>
  </nav>
  <script src="/static/app.js"></script>
</body>
</html>
