<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI 情绪日记</title>
  <meta name="theme-color" content="#e85a7a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="情绪日记">
  <link rel="manifest" href="/static/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/static/icon.svg">
  <link rel="apple-touch-icon" href="/static/icon.svg">
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="bg-glow"></div>
  <div class="container">
    <header>
      <h1>AI 情绪日记</h1>
      <p class="subtitle">记录当下，温柔看见自己的情绪变化</p>
      <div class="top-bar">
        <label>人格风格</label>
        <select id="persona">
          {% for name in personas %}
          <option value="{{ name }}">{{ name }}</option>
          {% endfor %}
        </select>
        <label>回答语言</label>
        <select id="language">
          <option value="auto">自动</option>
          <option value="zh">中文</option>
          <option value="en">English</option>
        </select>
        <nav>
          <a class="active" href="/">分析</a>
          <a href="/history">历史记录</a>
          <a href="/trends">趋势分析</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="diary-section card">
        <h2>记录今日感受</h2>
        <textarea id="diary" rows="6" placeholder="写下你今天的心情（支持 emoji）。"></textarea>
        <div class="action-row">
          <button id="analyze">开始分析</button>
        </div>
        <div id="analysis-result" class="result-box hidden result-pretty"></div>
        <div id="analysis-error" class="error-box hidden"></div>
      </section>
    </main>
    <footer class="footer-note">AI 结果仅供参考，不替代专业心理咨询或医疗建议。</footer>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
