<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI 情绪日记 - 趋势分析</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="bg-glow"></div>
  <div class="container">
    <header>
      <h1>AI 情绪日记</h1>
      <p class="subtitle">从趋势和关键词看见情绪的长期变化</p>
      <div class="top-bar">
        <nav>
          <a href="/">分析</a>
          <a href="/history">历史记录</a>
          <a class="active" href="/trends">趋势分析</a>
        </nav>
      </div>
    </header>
    <main>
      <section class="section card">
        <h2>情绪趋势（近 7 天）</h2>
        <div class="chart-wrap">
          <canvas id="trend-chart"></canvas>
        </div>
      </section>
      <section class="section card">
        <h3>高频关键词（近 14 天）</h3>
        <div id="keywords" class="keywords"></div>
      </section>
    </main>
    <footer class="footer-note">AI 结果仅供参考，不替代专业心理咨询或医疗建议。</footer>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
