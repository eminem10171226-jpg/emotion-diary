<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI 情绪日记 - 趋势分析</title>
  <meta name="theme-color" content="#e85a7a">
  <link rel="manifest" href="/static/manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="bg-glow"></div>
  <div class="container">
    <header>
      <h1 data-i18n="appTitle">AI 情绪日记</h1>
      <p class="subtitle" data-i18n="trendsSubtitle">从心情天气和趋势曲线看见情绪的长期变化</p>
    </header>
    <main>
      <section class="section card weather-panel">
        <div class="weather-title-row">
          <div>
            <p class="section-kicker">Mood Weather</p>
            <h2 data-i18n="moodWeatherTitle">心情天气</h2>
          </div>
        </div>
        <div id="mood-weather" class="mood-weather"></div>
      </section>
      <section class="section card trend-panel">
        <div class="trend-title-row">
          <div>
            <p class="section-kicker">Mood Flow</p>
            <h2 data-i18n="trendTitle">情绪趋势（近 7 天）</h2>
          </div>
          <span class="trend-period">7 days</span>
        </div>
        <div class="chart-wrap">
          <canvas id="trend-chart" role="img" aria-label="最近 7 天情绪分数折线图" data-i18n-aria-label="trendChartLabel"></canvas>
        </div>
        <div id="trend-summary" class="trend-summary" aria-live="polite"></div>
      </section>
      <section class="section card mood-map-panel">
        <div class="trend-title-row">
          <div>
            <p class="section-kicker">Mood Map</p>
            <h2 data-i18n="moodMapTitle">情绪地图</h2>
          </div>
        </div>
        <div id="mood-map" class="mood-map"></div>
      </section>
      <section class="section card weekly-report-panel">
        <div class="trend-title-row">
          <div>
            <p class="section-kicker">Weekly Review</p>
            <h2 data-i18n="weeklyReportTitle">情绪复盘周报</h2>
          </div>
        </div>
        <div id="weekly-report" class="weekly-report"></div>
      </section>
    </main>
    <footer class="footer-note" data-i18n="footerNote">AI 结果仅供参考，不替代专业心理咨询或医疗建议。</footer>
  </div>
  <nav class="bottom-nav" aria-label="页面导航">
    <a href="/">
      <span class="nav-mark" aria-hidden="true">
        <svg class="nav-icon" viewBox="0 0 24 24">
          <path d="M4 10.6 12 4l8 6.6v8.2a1.8 1.8 0 0 1-1.8 1.8H5.8A1.8 1.8 0 0 1 4 18.8v-8.2Z"/>
          <path d="M8.2 11.5h7.6M8.2 15h5.3"/>
        </svg>
      </span>
      <span class="nav-label" data-i18n="navAnalyze">分析</span>
    </a>
    <a href="/history">
      <span class="nav-mark" aria-hidden="true">
        <svg class="nav-icon" viewBox="0 0 24 24">
          <path d="M4.5 12a7.5 7.5 0 1 0 2.1-5.2"/>
          <path d="M4.4 5v4h4M12 8v4.4l3 1.8"/>
        </svg>
      </span>
      <span class="nav-label" data-i18n="navHistory">历史记录</span>
    </a>
    <a class="active" href="/trends" aria-current="page">
      <span class="nav-mark" aria-hidden="true">
        <svg class="nav-icon" viewBox="0 0 24 24">
          <path d="M4 18.5h16M5.2 15.6 9 11.8l3.2 2.9 5.9-7.1"/>
          <path d="M9 11.8h.01M12.2 14.7h.01M18.1 7.6h.01"/>
        </svg>
      </span>
      <span class="nav-label" data-i18n="navTrends">趋势分析</span>
    </a>
    <a href="/kit">
      <span class="nav-mark" aria-hidden="true">
        <svg class="nav-icon" viewBox="0 0 24 24">
          <path d="M8.4 7.2V5.9a1.8 1.8 0 0 1 1.8-1.8h3.6a1.8 1.8 0 0 1 1.8 1.8v1.3"/>
          <path d="M5.4 7.2h13.2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5.4a2 2 0 0 1-2-2v-9a2 2 0 0 1 2-2Z"/>
          <path d="M12 10.5v6.2M8.9 13.6h6.2"/>
        </svg>
      </span>
      <span class="nav-label" data-i18n="navKit">急救包</span>
    </a>
  </nav>
  <script src="/static/app.js"></script>
</body>
</html>
